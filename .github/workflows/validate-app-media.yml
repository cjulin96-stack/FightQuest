name: Validate FightQuest app and demo media

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "index.html"
      - "style.css"
      - "assets/VIDEO-CREDITS.md"
      - ".github/workflows/validate-app-media.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check app JavaScript syntax
        run: node --check app.js
      - name: Confirm available demos, written guides, and anatomy notes
        run: |
          grep -q 'function openExerciseDemo(key)' app.js
          grep -q 'const exerciseInfo=' app.js
          grep -q 'function achievements()' app.js
          grep -q 'function weeklyActivity()' app.js
          grep -q 'function currentStreak()' app.js
          grep -q 'function openRestTimer()' app.js
          grep -q 'prep-panel' app.js
          grep -q 'data-rest' app.js
          grep -q 'demo-anatomy' app.js
          grep -q 'https://www.dvidshub.net/video/embed/517502' app.js
          grep -q 'player.vimeo.com/video/76827072' app.js
          grep -q 'youtube-nocookie.com/embed/X9sGmsGYYE0' app.js
          grep -q 'player.vimeo.com/video/329687341' app.js
          grep -q 'Bent-over_row_-_exercise_demonstration_video.webm' app.js
          grep -q 'www.dvidshub.net/video/embed/692857' app.js
          grep -q 'youtube-nocookie.com/embed/6VP5KFF54N0' app.js
          grep -q 'youtube-nocookie.com/embed/LFfmd7lzVWQ' app.js
          grep -q 'youtube-nocookie.com/embed/Gse7WT-spEQ' app.js
          grep -q 'youtube-nocookie.com/embed/GVEJIzsQKqw' app.js
          grep -q 'player.vimeo.com/video/265912003' app.js
          grep -q 'youtube-nocookie.com/embed/6kkQ2IV6Ymo' app.js
          grep -q 'demo-placeholder' app.js
          ! grep -q 'instructor3d.js' index.html
          grep -q 'app.js?v=29' index.html
          grep -q 'style.css?v=29' index.html
          test -s assets/VIDEO-CREDITS.md
          echo "Twelve exercise demos, written fallbacks, anatomy notes, and source credits are present."
