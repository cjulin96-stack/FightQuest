name: Validate FightQuest app and demo media

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "index.html"
      - "style.css"
      - "assets/VIDEO-CREDITS.md"
      - ".github/workflows/validate-app-media.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check app JavaScript syntax
        run: node --check app.js
      - name: Confirm all workout demos and muscle guides
        run: |
          grep -q 'function openExerciseDemo(key)' app.js
          grep -q 'const exerciseInfo=' app.js
          grep -q 'demo-anatomy' app.js
          grep -q 'https://www.dvidshub.net/video/embed/517502' app.js
          grep -q 'youtube-nocookie.com/embed/zR31Ytxj9E4' app.js
          grep -q 'Bent-over_row_-_exercise_demonstration_video.webm' app.js
          grep -q 'youtube-nocookie.com/embed/iU423T5b99w' app.js
          grep -q 'youtube-nocookie.com/embed/s2UkxRg40Mg' app.js
          grep -q 'youtube-nocookie.com/embed/r7thg-rW5W8' app.js
          grep -q 'youtube-nocookie.com/embed/f7EBbPsfPWI' app.js
          grep -q 'youtube-nocookie.com/embed/ZaeoXY6Ikq4' app.js
          grep -q 'youtube-nocookie.com/embed/aaAaUG9-E8E' app.js
          grep -q 'youtube-nocookie.com/embed/uWLFT9MJQ18' app.js
          grep -q 'youtube-nocookie.com/embed/DlAJTL1BRac' app.js
          ! grep -q 'instructor3d.js' index.html
          grep -q 'app.js?v=23' index.html
          grep -q 'style.css?v=23' index.html
          test -s assets/VIDEO-CREDITS.md
          echo "All 12 exercise demos, anatomy notes, source credits, and app entry point are present."
